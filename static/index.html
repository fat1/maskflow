<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaskFlow</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1c1d1f; --muted:#6b6e73; --line:#dfddd6; --accent:#0b6e4f; --bad:#b3261e; --code:#17191c; --codeink:#e6e6e1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141517; --panel:#1e2023; --ink:#ecece8; --muted:#a0a3a8; --line:#34373b; --accent:#4fc79a; --bad:#ff8a80; --code:#0e0f11; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:32px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  h1 { margin:0; font-size:24px; }
  .muted { color:var(--muted); font-size:13px; }
  .side { text-align:right; }
  #lang { font:inherit; font-size:13px; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:3px 12px; cursor:pointer; margin-bottom:4px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  input[type=file], textarea { width:100%; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:9px; margin-bottom:12px; }
  textarea { min-height:76px; resize:vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font:inherit; font-size:13px; color:inherit; background:transparent; border:1px solid var(--line); border-radius:99px; padding:3px 11px; cursor:pointer; }
  #go { font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:6px; padding:9px 22px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { #go { color:#0c1512; } }
  #go:disabled { opacity:.5; cursor:default; }
  progress { width:100%; height:8px; accent-color:var(--accent); }
  #error { color:var(--bad); white-space:pre-wrap; }
  pre { background:var(--code); color:var(--codeink); padding:14px; border-radius:6px; overflow-x:auto; font:13px/1.5 Consolas,monospace; margin:0; }
  .videos { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  video { width:100%; border-radius:6px; background:#000; display:block; }
  .stats { margin:12px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>MaskFlow</h1><div class="muted" data-i18n="tagline"></div></div>
    <div class="side">
      <button type="button" id="lang"></button>
      <div class="muted" id="device"></div>
    </div>
  </header>

  <section>
    <form id="form">
      <label for="video" data-i18n="videoLabel"></label>
      <input id="video" type="file" accept="video/*" required>
      <label for="rule" data-i18n="ruleLabel"></label>
      <textarea id="rule" required maxlength="500"></textarea>
      <div class="chips" id="chips"></div>
      <button id="go" data-i18n="start"></button>
    </form>
  </section>

  <section id="statusBox" hidden>
    <label id="stage"></label>
    <progress id="bar" max="1"></progress>
    <div id="error" hidden></div>
    <div class="muted stats" id="stats"></div>
  </section>

  <section id="codeBox" hidden>
    <label data-i18n="codeLabel"></label>
    <pre id="code"></pre>
  </section>

  <section id="resultBox" hidden>
    <div class="videos">
      <div><label data-i18n="before"></label><video id="before" controls muted></video></div>
      <div><label data-i18n="after"></label><video id="after" controls muted></video></div>
    </div>
  </section>
</main>
<script>
const I18N = {
  zh: {
    htmlLang: 'zh-CN', switchTo: 'English',
    tagline: '用一句话描述打码规则，视频只在本地 GPU 上处理',
    device: '运行设备：', videoLabel: '视频（最长 3600 帧，200MB 以内）', ruleLabel: '打码规则',
    start: '开始处理', codeLabel: 'Ling-3.2-flash 为这条规则生成的代码', before: '原视频', after: '处理后',
    defaultRule: '遮挡所有人脸，但穿红色衣服的人不打码',
    chips: ['遮挡所有人脸', '只遮挡画面左半边的人脸', '前 2 秒不处理，之后遮挡所有人和车辆', '遮挡屏幕、手机和笔记本电脑'],
    uploading: '上传中', working: '处理中', done: '处理完成', failed: '处理失败', submitFailed: '提交失败',
    stages: { queued: '排队中', ling: 'Ling-3.2-flash 生成规则代码', detect: 'GPU 检测与跟踪', sandbox: '沙箱执行规则', render: '打码并用 NVENC 编码' },
    stats: s => `${s.frames} 帧 · ${s.detections} 个检测 · 打码 ${s.masked} 个 · Ling ${s.ling_seconds}s · 检测 ${s.detect_seconds}s${s.cache_hit ? '（使用缓存）' : ''} · 编码 ${s.render_seconds}s`,
  },
  en: {
    htmlLang: 'en', switchTo: '中文',
    tagline: 'Describe a masking rule in one sentence. Your video stays on the local GPU.',
    device: 'Device: ', videoLabel: 'Video (up to 3600 frames, 200 MB)', ruleLabel: 'Masking rule',
    start: 'Start', codeLabel: 'Code generated by Ling-3.2-flash for this rule', before: 'Original', after: 'Masked',
    defaultRule: 'Mask all faces, except people wearing red',
    chips: ['Mask all faces', 'Mask only faces on the left half of the frame', 'Skip the first 2 seconds, then mask all people and vehicles', 'Mask screens, phones and laptops'],
    uploading: 'Uploading', working: 'Processing', done: 'Done', failed: 'Failed', submitFailed: 'Submission failed',
    stages: { queued: 'Queued', ling: 'Ling-3.2-flash is generating the rule code', detect: 'GPU detection and tracking', sandbox: 'Running the rule in the sandbox', render: 'Masking and encoding with NVENC' },
    stats: s => `${s.frames} frames · ${s.detections} detections · ${s.masked} masked · Ling ${s.ling_seconds}s · Detection ${s.detect_seconds}s${s.cache_hit ? ' (cached)' : ''} · Encoding ${s.render_seconds}s`,
  },
};

const $ = id => document.getElementById(id);
let deviceName = '';
let view = null;  // what the status panel shows, so a language switch can redraw it

function storedLang() {
  try { return localStorage.getItem('maskflow-lang'); } catch { return null; }
}
function saveLang(value) {
  try { localStorage.setItem('maskflow-lang', value); } catch { /* per-viewer convenience only */ }
}

let lang = storedLang();
if (!I18N[lang]) lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const t = () => I18N[lang];

function drawStatus() {
  if (!view) return;
  const text = t();
  if (view.kind === 'message') $('stage').textContent = text[view.key];
  if (view.kind === 'stage') $('stage').textContent = text.stages[view.key] || text.working;
  $('stats').textContent = view.stats ? text.stats(view.stats) : '';
}

function applyLang() {
  const text = t();
  document.documentElement.lang = text.htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = text[el.dataset.i18n]; });
  $('lang').textContent = text.switchTo;
  if (deviceName) $('device').textContent = text.device + deviceName;
  $('chips').replaceChildren(...text.chips.map(label => {
    const chip = document.createElement('button');
    chip.type = 'button'; chip.className = 'chip'; chip.textContent = label;
    return chip;
  }));
  const rule = $('rule');
  const untouched = !rule.value || Object.values(I18N).some(l => l.defaultRule === rule.value);
  if (untouched) rule.value = text.defaultRule;
  drawStatus();
}

function setView(next) { view = next; drawStatus(); }
function showError(message) { $('error').hidden = false; $('error').textContent = message; }

$('lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  saveLang(lang);
  applyLang();
});
$('chips').addEventListener('click', e => { if (e.target.matches('.chip')) $('rule').value = e.target.textContent; });

fetch('/api/system').then(r => r.json()).then(s => { deviceName = s.device; applyLang(); });

async function poll(id) {
  const job = await (await fetch('/api/jobs/' + id)).json();
  if (job.code) { $('codeBox').hidden = false; $('code').textContent = job.code; }
  if (job.status === 'done' || job.status === 'failed') {
    $('bar').hidden = true;
    $('go').disabled = false;
    if (job.status === 'failed') {
      setView({ kind: 'message', key: 'failed' });
      showError(job.error);
      return;
    }
    setView({ kind: 'message', key: 'done', stats: job.stats });
    $('before').src = `/api/jobs/${id}/input`;
    $('after').src = `/api/jobs/${id}/output`;
    $('resultBox').hidden = false;
    return;
  }
  setView({ kind: 'stage', key: job.stage });
  if (job.progress === null) $('bar').removeAttribute('value'); else $('bar').value = job.progress;
  setTimeout(() => poll(id), 800);
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true;
  $('statusBox').hidden = false; $('bar').hidden = false;
  $('error').hidden = true; $('codeBox').hidden = true; $('resultBox').hidden = true;
  setView({ kind: 'message', key: 'uploading' });
  $('bar').removeAttribute('value');
  const body = new FormData();
  body.append('video', $('video').files[0]);
  body.append('rule', $('rule').value);
  const response = await fetch('/api/jobs', { method: 'POST', body });
  const data = await response.json();
  if (!response.ok) {
    setView({ kind: 'message', key: 'submitFailed' });
    $('bar').hidden = true;
    showError(data.detail);
    $('go').disabled = false;
    return;
  }
  poll(data.id);
});

applyLang();
</script>
</body>
</html>
